<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>Document</title>
</head>

<body>

    <div class="container">
        <div class="home-container">
            <div class="home-header">
                <div class="home-header-profile">
                    <div class="home-header-profile-photo">JD</div>
                    <div class="home-header-profile-name">Hello, John</div>
                </div>
                <div class="home-header-bars">
                    <?xml version="1.0" encoding="UTF-8"?><svg width="24px" height="24px" stroke-width="1.5"
                        viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#000000">
                        <path d="M3 5H21" stroke="#000000" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                        <path d="M3 12H21" stroke="#000000" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                        <path d="M3 19H21" stroke="#000000" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                    </svg>
                </div>
            </div>

            <div class="home-balance-card">
                <div class="home-balance-card-title">Total Balance</div>
                <div class="home-balance-card-amount">
                    <span>&#xFF04;</span><span class="home-balance">8 200</span>
                </div>
            </div>

            <div class="home-wallet-address">
                <div class="home-wallet-title">Your Wallet Address</div>
                <div class="home-wallet-main-content">
                    <div class="home-wallet-main">0x742...C10D</div>
                    <div class="home-wallet-buttons">
                        <div class="home-wallet-show">
                            <?xml version="1.0" encoding="UTF-8"?><svg width="24px" height="24px" viewBox="0 0 24 24"
                                stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg" color="#fff">
                                <path d="M19.5 16L17.0248 12.6038" stroke="#fff" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M12 17.5V14" stroke="#fff" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round"></path>
                                <path d="M4.5 16L6.96895 12.6124" stroke="#fff" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M3 8C6.6 16 17.4 16 21 8" stroke="#fff" stroke-width="1.5"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <div class="home-wallet-copy">
                            <?xml version="1.0" encoding="UTF-8"?><svg width="24px" height="24px" stroke-width="1.5"
                                viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" color="#fff">
                                <path
                                    d="M19.4 20H9.6C9.26863 20 9 19.7314 9 19.4V9.6C9 9.26863 9.26863 9 9.6 9H19.4C19.7314 9 20 9.26863 20 9.6V19.4C20 19.7314 19.7314 20 19.4 20Z"
                                    stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                </path>
                                <path
                                    d="M15 9V4.6C15 4.26863 14.7314 4 14.4 4H4.6C4.26863 4 4 4.26863 4 4.6V14.4C4 14.7314 4.26863 15 4.6 15H9"
                                    stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                </path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
